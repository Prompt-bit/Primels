<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@codemirror/basic-setup@^0.20.0/theme-one-dark.css" />

<title>PrImElS BoY</title>

<!-- CodeMirror 6 CSS -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@codemirror/basic-setup@^0.20.0/theme-one-dark.css" />

<style>
  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    max-width: 700px;
    margin: 2rem auto;
    background: #f9fafb;
    padding: 1rem;
    color: #1f2937;
  }
  h1 {
    color: #2563eb;
    text-align: center;
  }
  #editor {
    border: 1px solid #ccc;
    border-radius: 6px;
    height: 300px;
    font-size: 1rem;
  }
  button {
    margin-top: 1rem;
    background-color: #2563eb;
    color: white;
    border: none;
    padding: 0.5rem 1rem;
    border-radius: 6px;
    cursor: pointer;
    font-size: 1rem;
  }
  button:hover {
    background-color: #1d4ed8;
  }
  #output {
    margin-top: 1rem;
    background: #e0e7ff;
    padding: 1rem;
    border-radius: 6px;
    min-height: 50px;
    white-space: pre-wrap;
  }
</style>
</head>
<body>

<h1>Write your JavaScript code</h1>
<h2>In <a href="https://codepen.io" target="_blank">CodePen</a></h2>

<div id="editor"></div>

<button id="runBtn">Run Code</button>

<div id="output"></div>

<!-- Load CodeMirror 6 from CDN -->
<script type="module">
  import {EditorView, basicSetup} from "https://cdn.jsdelivr.net/npm/@codemirror/basic-setup@0.20.2/dist/index.js";
  import {javascript} from "https://cdn.jsdelivr.net/npm/@codemirror/lang-javascript@0.19.4/dist/index.js";
  import {oneDark} from "https://cdn.jsdelivr.net/npm/@codemirror/theme-one-dark@0.19.5/dist/index.js";

  const output = document.getElementById("output");

  const editor = new EditorView({
    doc: `// Write a function to return square of a number
function square(n) {
  return n * n;
}`,
    extensions: [basicSetup, javascript(), oneDark],
    parent: document.getElementById("editor"),
  });

  document.getElementById("runBtn").onclick = () => {
    try {
      // Evaluate code and capture result of last expression or function output
      let code = editor.state.doc.toString();
      let result = eval(code);
      output.textContent = "Result:\n" + result;
    } catch (e) {
      output.textContent = "Error:\n" + e.message;
    }
  };
</script>

</body>
</html>
